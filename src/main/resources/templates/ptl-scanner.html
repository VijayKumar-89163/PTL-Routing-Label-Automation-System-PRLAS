<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-MART PRLAS | Scanner</title>

    <!-- Local (self-hosted) CSS — no internet needed -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/toastify.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid p-0 d-flex flex-column flex-lg-row min-vh-100">

    <!-- Sidebar / Header -->
    <aside class="vm-sidebar p-3">
        <div class="brand-box text-center py-3 mb-4">
            <div class="vm-logo mx-auto">V</div>
            <h5 class="fw-bold m-0 mt-2 text-white">V-MART</h5>
            <small class="text-light-50 fs-8">PRLAS System</small>
        </div>
        <nav class="nav flex-column gap-2 sidebar-nav">
            <a class="nav-link active" href="/ptl-scanner">
                <svg class="bi-icon me-2" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M0 .5A.5.5 0 0 1 .5 0h3a.5.5 0 0 1 0 1H1v2.5a.5.5 0 0 1-1 0v-3Zm12 0a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0V1h-2.5a.5.5 0 0 1-.5-.5ZM.5 12a.5.5 0 0 1 .5.5V15h2.5a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5v-3a.5.5 0 0 1 .5-.5Zm15 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1 0-1H15v-2.5a.5.5 0 0 1 .5-.5ZM3 3h3v3H3V3Zm0 7h3v3H3v-3Zm7-7h3v3h-3V3ZM7 2H2v5h5V2Zm0 7H2v5h5V9Zm2-7h5v5H9V2ZM4 4h1v1H4V4Zm7 0h1v1h-1V4Zm-6 7H4v1h1v-1Zm3.5-3H8v2h1v1H8v1h2v-2h1v2h1v-1h2v-1h-3V8H8.5Zm1.5 2V9H9v1h1Zm4 3.5V12h-1v1h-2v1h3v-.5Zm-4 .5v-1H8v1h2Zm2-5h2V8h-2v1Z"/></svg>
                PTL Scanner
            </a>
            <a class="nav-link" href="/ptl-dashboard">
                <svg class="bi-icon me-2" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M0 1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1zm9 0a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1zm0 9a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z"/></svg>
                Dashboard
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow-1 p-3 p-md-4">

        <!-- Printer Connection Status Header -->
        <div class="card card-vm p-3 mb-3">
            <div class="printer-status-row d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <div id="printerStatusBadge" class="status-icon bg-danger-subtle text-danger">
                        <svg class="bi-icon fs-4" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M5 1a2 2 0 0 0-2 2v1h10V3a2 2 0 0 0-2-2H5zm6 8H5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"/><path d="M0 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2H2a2 2 0 0 1-2-2V7zm2.5 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/></svg>
                    </div>
                    <div>
                        <span class="fs-8 text-muted fw-bold">PRINTER STATUS</span>
                        <h6 id="printerStatusText" class="m-0 fw-bold text-danger">DISCONNECTED</h6>
                    </div>
                </div>
                <button class="btn btn-outline-dark btn-sm" onclick="connectPrinter()">
                    <svg class="bi-icon me-1" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6 0a.5.5 0 0 1 .5.5V3h3V.5a.5.5 0 0 1 1 0V3h1a.5.5 0 0 1 .5.5v3A3.5 3.5 0 0 1 8.5 10c-.002.434-.01.845-.04 1.22-.041.514-.126 1.003-.317 1.424a2.08 2.08 0 0 1-.97 1.028C6.725 13.9 6.169 14 5.5 14c-.998 0-1.61.33-1.974.718A1.92 1.92 0 0 0 3 16H2c0-.616.232-1.367.797-1.968C3.374 13.42 4.261 13 5.5 13c.581 0 .962-.088 1.218-.219.241-.123.4-.3.514-.55.121-.266.193-.621.23-1.09.027-.34.035-.718.037-1.141A3.5 3.5 0 0 1 4 6.5v-3a.5.5 0 0 1 .5-.5h1V.5A.5.5 0 0 1 6 0"/></svg>
                    Connect Printer
                </button>
            </div>
        </div>

        <!-- LPN Barcode Input Card -->
        <div class="card card-vm p-3 p-md-4 mb-3">
            <h6 class="fw-bold mb-3">
                <svg class="bi-icon me-2 text-vm-primary" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M0 .5A.5.5 0 0 1 .5 0h3a.5.5 0 0 1 0 1H1v2.5a.5.5 0 0 1-1 0v-3Zm12 0a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0V1h-2.5a.5.5 0 0 1-.5-.5ZM.5 12a.5.5 0 0 1 .5.5V15h2.5a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5v-3a.5.5 0 0 1 .5-.5Zm15 0a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1 0-1H15v-2.5a.5.5 0 0 1 .5-.5ZM3 3h3v3H3V3Zm0 7h3v3H3v-3Zm7-7h3v3h-3V3ZM7 2H2v5h5V2Zm0 7H2v5h5V9Zm2-7h5v5H9V2ZM4 4h1v1H4V4Zm7 0h1v1h-1V4Zm-6 7H4v1h1v-1Zm3.5-3H8v2h1v1H8v1h2v-2h1v2h1v-1h2v-1h-3V8H8.5Zm1.5 2V9H9v1h1Zm4 3.5V12h-1v1h-2v1h3v-.5Zm-4 .5v-1H8v1h2Zm2-5h2V8h-2v1Z"/></svg>
                SCAN LPN
            </h6>
            <div class="row g-2 align-items-center">
                <div class="col-12 col-md-8">
                    <input type="text" id="lpnInput" class="form-control form-control-lg" placeholder="Scan or type LPN number and press Enter" onkeypress="if(event.key==='Enter') processLpnScan()">
                </div>
                <div class="col-6 col-md-2">
                    <button class="btn btn-vm-primary w-100 py-2 fw-semibold" onclick="processLpnScan()">
                        <svg class="bi-icon me-1" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
                        Scan
                    </button>
                </div>
                <div class="col-6 col-md-2">
                    <div class="form-check form-switch pt-1">
                        <input class="form-check-input" type="checkbox" id="autoPrintCheck" checked>
                        <label class="form-check-input-label fw-semibold fs-7" for="autoPrintCheck">Auto Print</label>
                    </div>
                </div>
            </div>

            <!-- Result Card (Populates upon scanning) -->
            <div id="resultCard" class="mt-4 p-3 rounded border" style="display: none;"></div>
        </div>

        <!-- Last 10 Scans History Table -->
        <div class="card card-vm p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold m-0">
                    <svg class="bi-icon me-2 text-vm-primary" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.004.45a7 7 0 0 0-.985-.299l.219-.976q.576.129 1.126.342zm1.37.71a7 7 0 0 0-.439-.27l.493-.87a8 8 0 0 1 .979.654l-.615.789a7 7 0 0 0-.418-.302zm1.834 1.79a7 7 0 0 0-.653-.796l.724-.69q.406.429.747.91zm.744 1.352a7 7 0 0 0-.214-.468l.893-.45a8 8 0 0 1 .45 1.088l-.95.313a7 7 0 0 0-.179-.483m.53 2.507a7 7 0 0 0-.1-1.025l.985-.17q.1.58.116 1.17zm-.131 1.538q.05-.254.081-.51l.993.123a8 8 0 0 1-.23 1.155l-.964-.267q.069-.247.12-.501m-.952 2.379q.276-.436.486-.908l.914.405q-.24.54-.555 1.038zm-.964 1.205q.183-.183.35-.378l.758.653a8 8 0 0 1-.401.432z"/><path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0z"/><path d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5"/></svg>
                    LAST 10 SCANS
                </h6>
                <button class="btn btn-sm btn-light border" onclick="fetchRecentScans()">
                    <svg class="bi-icon" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg>
                    Refresh
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle border-0 m-0">
                    <thead class="table-light fs-8">
                    <tr>
                        <th>LPN</th>
                        <th>Group</th>
                        <th>Location</th>
                        <th>Zones (16 Zones / 8 Pairs)</th>
                        <th>Scanned At</th>
                    </tr>
                    </thead>
                    <tbody id="recentScansBody">
                    <tr><td colspan="5" class="text-center py-3 text-muted">No scan records found</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- Local (self-hosted) JS — no internet needed -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/toastify.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
