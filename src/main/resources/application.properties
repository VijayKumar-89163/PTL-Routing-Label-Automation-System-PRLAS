spring.application.name=PTL-Routing-Label-Automation-System-PRLAS
server.port=8083

# MySQL Connection with Local Infile Enabled
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/PTL-Routing-Db?createDatabaseIfNotExist=true&allowLoadLocalInfile=true&allowMultiQueries=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vijay}

# JPA / Hibernate Configurations
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format-sql=true
spring.jpa.hibernate.ddl-auto=update

# Batch Processing Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

# Multipart / File Upload Settings (50MB Limit)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#SSL certificate configurations
server.ssl.enabled=true
server.ssl.key-store=classpath:SSL.p12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# ================== Console Log -> Daily File Logging ==================
logging.file.name=logs/prlas.log
logging.logback.rollingpolicy.file-name-pattern=logs/prlas-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Log level
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.PRLAS=DEBUG

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n